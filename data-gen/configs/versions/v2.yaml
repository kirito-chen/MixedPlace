dataset_name: v2
seed: 61
out_dir: data-gen/outputs
print_every: 100
num_workers: 64  # 64

# 这两个在外部参数设置了
# num_train_samples: 40000
# num_val_samples: 2000

algorithm: v2
gen_params:
  max_instance: 800 # 1600 # x4  废弃
  # =========== new ===========
  min_hard_macros: 150  # 150
  max_hard_macros:  800 # 300 
  # max_soft_macros: 100 
  min_cells: 10000  # 10000
  max_cells: 220000  # 220000 
  # enable_macro_refine: 1
  # refine_ratio: 0.7
  num_clusters: 512
  random_cell: True
  # ===========================
  stop_density_dist:
    dist_type: uniform
    dist_params:
      low: 0.75
      high: 0.85 # 0.9
  max_attempts_per_instance: 10
  aspect_ratio_dist:
    dist_type: uniform
    dist_params:
      low: 0.25
      high: 1.0  # 1.0
  cell_aspect_ratio_dist:
    dist_type: uniform
    dist_params:
      low: 0.25
      high: 1.5  # 1.0
  instance_size_dist:
    dist_type: clipped_exp
    dist_params:
      scale: 0.04 # 1/2
      clip_min: 0.01 # 1/2
      clip_max: 0.5 # 1/2
  num_terminals_dist:
    dist_type: cond_binomial
    dist_params:
      binom_p: 0.5
      binom_min_n: 4
      t: 315 # x(4**0.65)
      p: 0.65
  edge_dist:
    dist_type: cond_exp_hierarchical_bernoulli
    dist_params:
      global_scale: True
      scale_dist:
        dist_type: log_uniform
        dist_params: 
          low: 0.025 # 1/2
          high: 0.8 # 1/2
      prob_clip: 0.9
      prob_multiplier_factor: 0.00792 # x(2 ** -1.42)
      prob_multiplier_exp: -1.42
  source_terminal_dist:
    dist_type: bernoulli
    dist_params:
      probs: 0.3

logger:
  filter: .*
  wandb: false
